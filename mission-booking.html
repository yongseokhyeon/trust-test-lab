<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약 시스템 입력 검증 — TRUST&amp;TEST LAB</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/bughunt.js"></script>
</head>
<body data-page="lab">
  <header id="site-header"></header>

  <div class="page-head sw">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">홈</a> › <a href="lab.html">실습 LAB</a> › 버그 헌팅 미션</div>
      <div class="tags"><span class="tag sw">버그 헌팅 미션</span><span class="tag">중급</span><span class="tag">⏱ 약 30분</span><span class="tag blue">결과물: 테스트 케이스 + 버그 리포트</span></div>
      <h1>예약 시스템 입력 검증</h1>
      <ol class="stepper" id="stepper">
        <li><span class="dot">1</span>업무 브리핑</li><li><span class="dot">2</span>테스트 수행</li>
        <li><span class="dot">3</span>테스트 케이스</li><li><span class="dot">4</span>버그 리포트</li><li><span class="dot">5</span>결과·피드백</li>
      </ol>
    </div>
  </div>

  <main class="container page-body" id="hunt"></main>
  <footer id="site-footer"></footer>

  <script>
    /* 테스트 서버의 '오늘' 날짜는 고정 (실제 날짜와 무관하게 같은 결과가 나오도록) */
    const TODAY = "2026-11-10", LAST = "2026-12-10";
    const HOURS = Array.from({ length: 13 }, (_, i) => 9 + i);   // 09 ~ 21시 시작

    function check(v, buggy) {
      const e = {};
      // REQ-01 날짜
      if (!v.date) e.date = "예약 날짜를 선택해 주세요.";
      else if (!buggy && v.date < TODAY) e.date = "지난 날짜는 예약할 수 없어요. 11월 10일 이후 날짜를 선택해 주세요.";
      else if (v.date > LAST) e.date = "예약은 12월 10일까지만 가능해요. 더 가까운 날짜를 선택해 주세요.";
      // REQ-02 인원
      const p = Number(v.people);
      if (!Number.isInteger(p) || p < 1 || (buggy ? p >= 6 : p > 6)) e.people = "인원은 1~6명까지 예약할 수 있어요.";
      // REQ-04 이용 시간
      const d = Number(v.dur);
      if (!Number.isInteger(d) || d < 1 || d > 4) e.dur = "이용 시간은 1~4시간 사이로 입력해 주세요.";
      // REQ-03 종료 시각
      else if (!buggy && Number(v.start) + d > 22) e.dur = "운영 시간(22:00)을 넘는 예약은 할 수 없어요. 이용 시간을 줄이거나 시작 시간을 앞당겨 주세요.";
      // 이름
      if (!v.name) e.name = "예약자 이름을 입력해 주세요.";
      // REQ-05 연락처 (NFR-01: 결함 버전은 이해할 수 없는 오류 코드만 표시)
      if (!/^010\d{8}$/.test(v.phone.replace(/-/g, ""))) e.phone = buggy ? "ERR_4021" : "연락처는 010으로 시작하는 11자리 숫자로 입력해 주세요. (예: 010-1234-5678)";
      return e;
    }

    BugHunt({
      missionId: "m-sw-booking",
      from: "📨 보낸 사람: 트러스트 스터디카페 서비스 기획자 · 받는 사람: QA 엔지니어(나)",
      briefTitle: "업무 요청: 좌석 예약 화면 v1.3 입력 검증",
      briefHtml: `<p>스터디카페 온라인 좌석 예약 화면의 <b>입력 검증</b>을 테스트해 주세요. 날짜·인원·시간 같은 <b>경계 조건</b>은 물론,
        오류가 났을 때 사용자가 <b>무엇을 고쳐야 하는지 알 수 있는지</b>(사용성)도 함께 봐 주셨으면 합니다.</p>
        <p><b>참고:</b> 테스트 서버의 오늘 날짜는 <b>2026년 11월 10일</b>로 고정되어 있습니다.</p>
        <p style="margin:0"><b>제출물:</b> ① 테스트 케이스 (최소 8건 권장) ② 발견한 결함별 버그 리포트 (기능·비기능 모두)</p>`,
      version: "v1.3 · 테스트 환경", host: "test.truststudy.example/booking",
      env: "Chrome / 스터디카페 예약 v1.3 테스트 서버 (서버 날짜 2026-11-10)",
      reqs: [
        { id: "REQ-01", item: "예약 날짜", text: "오늘(11/10)부터 30일 후(12/10)까지 예약 가능. <b>지난 날짜 불가</b>" },
        { id: "REQ-02", item: "인원", text: "1~6명 (6명 포함)" },
        { id: "REQ-03", item: "운영 시간", text: "09:00~22:00. <b>종료 시각이 22:00을 넘는 예약 불가</b>" },
        { id: "REQ-04", item: "이용 시간", text: "1~4시간 (정수)" },
        { id: "REQ-05", item: "연락처", text: "010으로 시작하는 11자리 숫자 (하이픈 허용)" },
        { id: "NFR-01", item: "사용성", text: "모든 오류 메시지는 <b>무엇이 잘못되었는지와 해결 방법</b>을 사용자가 이해할 수 있는 말로 안내" },
      ],
      tips: [
        "<b>날짜 경계:</b> 11/9(어제), 11/10(오늘), 12/10(마지막 날), 12/11을 확인해 보세요.",
        "<b>조합 조건:</b> 시작 시간과 이용 시간을 더한 종료 시각이 22시를 넘는 경우(예: 20시 + 3시간)를 만들어 보세요.",
        "<b>비기능 결함:</b> 기능은 맞게 동작해도, 오류 메시지가 사용자에게 도움이 되지 않으면 NFR-01 위반입니다. 각 입력란에 틀린 값을 넣고 메시지를 읽어 보세요.",
      ],
      table: { title: "테스트 케이스 작성", short: "테스트 케이스", idPrefix: "TC", desc: "테스트 내용", input: "입력값", descPh: "예: 인원 상한 경계값", inputPh: "예: 인원=6" },
      minTc: 8,
      okLabel: "예약 완료", errLabel: "예약 실패",
      falsePosHint: "이용 시간 범위(REQ-04)와 연락처 형식 검사(REQ-05) 자체는 정상입니다. 연락처 문제는 '검사'가 아니라 '메시지'에 있었어요(NFR-01).",
      portfolioTitle: "트러스트 스터디카페 좌석 예약 v1.3 입력 검증 결과 보고",
      target: "트러스트 스터디카페 좌석 예약 화면 v1.3 — 날짜·인원·운영 시간·이용 시간·연락처 입력 검증(REQ-01~05) 및 오류 메시지 사용성(NFR-01)",
      bugs: [
        { id: "B1", req: "REQ-01", short: "지난 날짜", title: "지난 날짜로 예약이 완료됨", sev: "높음",
          how: "상한(12/10)만 검사하고 하한(오늘)을 검사하지 않았어요. 어제 날짜(11/9)처럼 <b>무효 파티션</b>의 값을 넣어 봐야 찾을 수 있습니다. 이미 지난 날짜의 예약이 쌓이면 좌석 관리가 꼬여요.",
          model: { title: "[예약] 지난 날짜(2026-11-09)를 선택해도 예약이 완료됨", steps: "1. 예약 화면 접속 (서버 날짜 2026-11-10)\n2. 날짜 2026-11-09, 인원 2, 시작 14:00, 이용 2시간, 이름·연락처 유효값 입력\n3. 예약하기 클릭", expected: "REQ-01에 따라 '지난 날짜는 예약할 수 없어요' 오류 표시", actual: "예약 완료 메시지와 예약번호 표시" } },
        { id: "B2", req: "REQ-02", short: "인원 상한 경계", title: "인원 6명이 거부됨 (경계값 결함)", sev: "보통",
          how: "<code>p &lt;= 6</code>을 <code>p &lt; 6</code>으로 구현했어요. 상한 경계값 6을 넣어야 찾을 수 있습니다.",
          model: { title: "[예약] 인원 6명 입력 시 '1~6명까지 예약할 수 있어요' 오류 발생", steps: "1. 예약 화면 접속\n2. 인원에 6, 나머지 항목은 유효값 입력\n3. 예약하기 클릭", expected: "REQ-02에 따라 6명은 예약 가능 → 예약 완료", actual: "'인원은 1~6명까지 예약할 수 있어요' 오류 표시" } },
        { id: "B3", req: "REQ-03", short: "운영 시간 초과", title: "종료 시각이 22:00을 넘는 예약이 허용됨", sev: "높음",
          how: "시작 시간과 이용 시간을 <b>조합</b>해야 드러나는 결함이에요. 각각은 유효한 값(20시 시작, 3시간)이지만 합치면 23시 종료가 됩니다. 단일 입력만 테스트하면 놓치기 쉬워요.",
          model: { title: "[예약] 20:00 시작 + 3시간 이용(23:00 종료) 예약이 완료됨", steps: "1. 예약 화면 접속\n2. 시작 시간 20:00, 이용 시간 3, 나머지 유효값 입력\n3. 예약하기 클릭", expected: "REQ-03에 따라 '운영 시간(22:00)을 넘는 예약은 할 수 없어요' 오류 표시", actual: "20:00~23:00 예약 완료" } },
        { id: "B4", req: "NFR-01", short: "오류 메시지 사용성", title: "연락처 오류 시 'ERR_4021'만 표시됨 (사용성 결함)", sev: "보통",
          how: "형식 검사 자체는 정상이지만, 사용자가 무엇을 고쳐야 할지 알 수 없는 오류 코드만 보여줍니다. 기능 결함이 아니어도 <b>비기능 요구사항(사용성)</b> 위반은 버그 리포트 대상이에요.",
          model: { title: "[예약] 연락처 형식 오류 시 원인을 알 수 없는 'ERR_4021'만 표시됨", steps: "1. 예약 화면 접속\n2. 연락처에 02-123-4567 입력, 나머지 유효값 입력\n3. 예약하기 클릭", expected: "NFR-01에 따라 '연락처는 010으로 시작하는 11자리 숫자로 입력해 주세요' 같은 안내 표시", actual: "'ERR_4021'만 표시되어 사용자가 원인과 해결 방법을 알 수 없음" } },
      ],
      renderApp(el, api) {
        el.innerHTML = `
          <div class="app-brand" style="color:#0d9488">TRUST STUDY CAFE</div>
          <p class="small muted" style="margin-bottom:14px">📅 좌석 예약 · 서버 날짜 2026.11.10(화)</p>
          <div class="field-row">
            <div class="field"><label for="bk-date">예약 날짜</label><input class="input" id="bk-date" type="date" value="2026-11-20"></div>
            <div class="field"><label for="bk-people">인원 (명)</label><input class="input" id="bk-people" value="2" inputmode="numeric"></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="bk-start">시작 시간</label><select class="select" id="bk-start">${HOURS.map(h => `<option value="${h}" ${h === 14 ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select></div>
            <div class="field"><label for="bk-dur">이용 시간 (시간)</label><input class="input" id="bk-dur" value="2" inputmode="numeric"></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="bk-name">예약자 이름</label><input class="input" id="bk-name" value="김테스트"></div>
            <div class="field"><label for="bk-phone">연락처</label><input class="input" id="bk-phone" value="010-1234-5678"></div>
          </div>
          <button class="btn btn-primary" id="bk-go" style="width:100%;background:#0d9488">예약하기</button>
          <div class="app-msg" id="bk-out"></div>`;
        $("#bk-go", el).addEventListener("click", () => {
          const v = { date: $("#bk-date", el).value, people: $("#bk-people", el).value.trim(), start: $("#bk-start", el).value,
                      dur: $("#bk-dur", el).value.trim(), name: $("#bk-name", el).value.trim(), phone: $("#bk-phone", el).value.trim() };
          const got = check(v, true), spec = check(v, false);
          const trig = [];
          if (!!got.date !== !!spec.date) trig.push("B1");
          if (!!got.people !== !!spec.people) trig.push("B2");
          if (!!got.dur !== !!spec.dur) trig.push("B3");
          if (got.phone && got.phone !== spec.phone) trig.push("B4");
          const input = `날짜 ${v.date || "(없음)"} / 인원 ${v.people || "(빈칸)"} / 시작 ${String(v.start).padStart(2, "0")}:00 / 이용 ${v.dur || "(빈칸)"}시간 / 이름 ${v.name || "(빈칸)"} / 연락처 ${v.phone || "(빈칸)"}`;
          const errs = Object.values(got);
          const out = $("#bk-out", el);
          if (errs.length) {
            out.className = "app-msg show error";
            out.innerHTML = `<b>예약할 수 없습니다.</b><ul>${errs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
            api.record(input, "오류: " + errs.join(" "), false, trig);
          } else {
            const end = Number(v.start) + Number(v.dur);
            const msg = `${v.date.slice(5).replace("-", "월 ")}일 ${String(v.start).padStart(2, "0")}:00~${String(end).padStart(2, "0")}:00, ${v.people}명 예약 완료 (예약번호 TS-${1000 + api.count()})`;
            out.className = "app-msg show success"; out.textContent = "✅ " + msg;
            api.record(input, msg, true, trig);
          }
        });
      },
    });
  </script>
</body>
</html>
